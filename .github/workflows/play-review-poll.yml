# Play 繝｡繧ｿ繝・・繧ｿ / 繝ｪ繝ｪ繝ｼ繧ｹ蜑肴署譚｡莉ｶ縺ｮ谺關ｽ繧・30 蛻・♀縺阪↓繝√ぉ繝・け縺励・# blocker 縺後≠繧後・ 1 莉ｶ縺ｮ Issue 繧剃ｽ懈・/譖ｴ譁ｰ縲∬ｧ｣豸医＠縺溘ｉ閾ｪ蜍輔け繝ｭ繝ｼ繧ｺ縺吶ｋ縲・#
# 笏笏 縺薙・繝・Φ繝励Ξ縺ｮ菴ｿ縺・婿 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
# 1. 縺薙・繝輔ぃ繧､繝ｫ繧偵い繝励Μ繝ｪ繝昴・ `.github/workflows/play-review-poll.yml` 縺ｫ繧ｳ繝斐・縲・# 2. 荳九・ <PLAY_PACKAGE_NAME> 繧・app.config.json stores.playPackageName 縺ｧ鄂ｮ謠帙・# 3. `PLAY_TRACK` 繧堤屮隕悶＠縺溘＞繝医Λ繝・け縺ｫ蜷医ｏ縺帙ｋ・・ndroid-play-release 縺ｨ蜷後§蛟､・峨・# 4. scripts/play-review-check.mjs 繧・partnership 縺九ｉ繧ｳ繝斐・縲・#
# 笏笏 蠢・ｦ√↑ GitHub Secrets 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
#   GOOGLE_PLAY_SA_JSON_BASE64          Service Account JSON 繧・base64 蛹・#   GOOGLE_PLAY_DATA_SAFETY_CSV         Data Safety CSV・育函繝ｻ莉ｻ諢擾ｼ・#   GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64  蜷・CSV 繧・base64 蛹厄ｼ井ｻｻ諢擾ｼ・#   ・・ndroid-play-release 縺ｨ蜷後§ secrets 繧貞・蛻ｩ逕ｨ縲りｿｽ蜉 secret 荳崎ｦ・ｼ・name: play-review-poll

on:
  # Scheduled polling disabled on 2026-07-31.
  # Reason: GitHub Actions rounds every run up to a full billable minute, so a
  #         sub-minute check on a */30 cron still burned ~1,440 min/month and
  #         helped push Actions past the 3,000-min free tier (~69 USD/month in
  #         Jun-Jul 2026).
  # Run it on demand instead: gh workflow run play-review-poll.yml
  # The workflow_run trigger below still fires it after android-play-release.
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - android-play-release
    types: [completed]
    branches: [main]

permissions:
  issues: write
  contents: read

concurrency:
  group: play-review-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # 竊・app.config.json 縺ｮ蛟､縺ｧ鄂ｮ謠幢ｼ・ndroid-play-release 縺ｨ荳閾ｴ縺輔○繧具ｼ・      PLAY_PACKAGE_NAME: <PLAY_PACKAGE_NAME>   # stores.playPackageName / 辟｡縺代ｌ縺ｰ identity.bundleId
      PLAY_TRACK: production                   # android-play-release 縺ｮ PLAY_TRACK 縺ｨ荳閾ｴ縺輔○繧・    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Poll Google Play readiness
        run: node scripts/play-review-check.mjs > play-review-report.json
        env:
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
          GOOGLE_PLAY_DATA_SAFETY_CSV: ${{ secrets.GOOGLE_PLAY_DATA_SAFETY_CSV }}
          GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64: ${{ secrets.GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64 }}

      - name: Create/update Play readiness issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('play-review-report.json', 'utf8'));
            core.info(`Play review report: ${JSON.stringify(report)}`);

            const title = `[Play review] production readiness blockers (${report.packageName})`;
            const labels = ['ci-failure', 'play-review'];
            const body = [
              `**Package:** \`${report.packageName}\``,
              `**Track:** \`${report.track}\``,
              `**Locale:** \`${report.locale}\``,
              `**Detected at:** ${report.timestamp}`,
              '',
              '### Release',
              report.release ? `- status: \`${report.release.status}\`\n- versionCodes: \`${(report.release.versionCodes || []).join(', ') || '(none)'}\`` : '- no release found',
              '',
              '### Listing',
              report.listing ? `- title: ${report.listing.title || '(missing)'}\n- shortDescription length: ${report.listing.shortDescriptionLength}\n- fullDescription length: ${report.listing.fullDescriptionLength}` : '- listing not readable',
              '',
              '### Images',
              `- icon: ${report.imageCounts?.icon || 0}`,
              `- featureGraphic: ${report.imageCounts?.featureGraphic || 0}`,
              `- phoneScreenshots: ${report.imageCounts?.phoneScreenshots || 0}`,
              '',
              '### Data Safety CSV input',
              `- configured: ${report.dataSafetyInputConfigured ? 'yes' : 'no'}`,
              '',
              '### Blockers',
              ...(report.blockers && report.blockers.length ? report.blockers.map((b) => `- ${b}`) : ['- none']),
              '',
              '### Warnings',
              ...(report.warnings && report.warnings.length ? report.warnings.map((w) => `- ${w}`) : ['- none']),
              '',
              '_Auto-created/updated by `.github/workflows/play-review-poll.yml`._',
            ].join('\n');

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
            });
            const existing = search.data.items[0];

            if (!report.blockers || report.blockers.length === 0) {
              if (existing && existing.state === 'open') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `笨・Google Play readiness blockers cleared at ${report.timestamp}.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              core.info('No Play readiness blockers.');
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open',
                labels,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.info(`Created issue #${created.data.number}: ${created.data.html_url}`);
            }
