# Google Play production readiness 監視
#
# 移植元: web-ios-android/templates/workflows/play-review-poll.yml
#         (元は partnership_program_website)
#
# Play メタデータ / リリース前提条件の欠落をチェックし、blocker があれば
# 1 件の Issue を作成/更新、解消したら自動クローズする。
#
# ── このリポでの調整点(2026-08-08) ──────────────────────────────────
# 1. cron を外した。キット正本は `*/30 * * * *`(30分おき)だが、このリポは
#    ed48d8130 "ci: stop 30-minute polling on review workflows" で
#    **意図的にポーリングを止めている**(Actions 課金の出血対策)。
#    キットをそのまま入れるとその意思決定を巻き戻すことになる。
#
# 2. workflow_run トリガも外し workflow_dispatch のみにした。
#    GOOGLE_PLAY_SA_JSON_BASE64 等の Play 系 Secrets が**1つも未登録**のため
#    (gh secret list で確認済み。Apple 系3点は登録済み)、自動起動させると
#    play-review-check.mjs が FATAL で必ず赤くなる。
#    「壊れて赤い」を「意図して手動」に変える方針。
#
#    → Play 申請を始めるときに Secrets を登録し、下の schedule/workflow_run を
#      復活させること。cron を戻す場合は課金影響を再検討する。
#
# 3. <PLAY_PACKAGE_NAME> を app.config.json stores.playPackageName の実値に置換。
#
# ── 必要な GitHub Secrets（現在すべて未登録）────────────────────────
#   GOOGLE_PLAY_SA_JSON_BASE64          Service Account JSON を base64 化
#   GOOGLE_PLAY_DATA_SAFETY_CSV         Data Safety CSV（生・任意）
#   GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64  同 CSV を base64 化（任意）
name: play-review-poll

on:
  workflow_dispatch: {}
  # Play 系 Secrets 登録後に復活させる（上のコメント参照）:
  # schedule:
  #   - cron: "*/30 * * * *"   # ← 課金影響を再検討してから
  # workflow_run:
  #   workflows:
  #     - android-play-release
  #   types: [completed]
  #   branches: [main]

permissions:
  issues: write
  contents: read

concurrency:
  group: play-review-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAY_PACKAGE_NAME: com.kimito.link.surechigai
      PLAY_TRACK: production                   # android-play-release の PLAY_TRACK と一致させる
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Poll Google Play readiness
        run: node scripts/play-review-check.mjs > play-review-report.json
        env:
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
          GOOGLE_PLAY_DATA_SAFETY_CSV: ${{ secrets.GOOGLE_PLAY_DATA_SAFETY_CSV }}
          GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64: ${{ secrets.GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64 }}

      - name: Create/update Play readiness issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('play-review-report.json', 'utf8'));
            core.info(`Play review report: ${JSON.stringify(report)}`);

            const title = `[Play review] production readiness blockers (${report.packageName})`;
            const labels = ['ci-failure', 'play-review'];
            const body = [
              `**Package:** \`${report.packageName}\``,
              `**Track:** \`${report.track}\``,
              `**Locale:** \`${report.locale}\``,
              `**Detected at:** ${report.timestamp}`,
              '',
              '### Release',
              report.release ? `- status: \`${report.release.status}\`\n- versionCodes: \`${(report.release.versionCodes || []).join(', ') || '(none)'}\`` : '- no release found',
              '',
              '### Listing',
              report.listing ? `- title: ${report.listing.title || '(missing)'}\n- shortDescription length: ${report.listing.shortDescriptionLength}\n- fullDescription length: ${report.listing.fullDescriptionLength}` : '- listing not readable',
              '',
              '### Images',
              `- icon: ${report.imageCounts?.icon || 0}`,
              `- featureGraphic: ${report.imageCounts?.featureGraphic || 0}`,
              `- phoneScreenshots: ${report.imageCounts?.phoneScreenshots || 0}`,
              '',
              '### Data Safety CSV input',
              `- configured: ${report.dataSafetyInputConfigured ? 'yes' : 'no'}`,
              '',
              '### Blockers',
              ...(report.blockers && report.blockers.length ? report.blockers.map((b) => `- ${b}`) : ['- none']),
              '',
              '### Warnings',
              ...(report.warnings && report.warnings.length ? report.warnings.map((w) => `- ${w}`) : ['- none']),
              '',
              '_Auto-created/updated by `.github/workflows/play-review-poll.yml`._',
            ].join('\n');

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
            });
            const existing = search.data.items[0];

            if (!report.blockers || report.blockers.length === 0) {
              if (existing && existing.state === 'open') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `✅ Google Play readiness blockers cleared at ${report.timestamp}.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              core.info('No Play readiness blockers.');
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open',
                labels,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.info(`Created issue #${created.data.number}: ${created.data.html_url}`);
            }
