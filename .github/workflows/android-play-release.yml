# Template: Google Play release pipeline (GitHub Actions)
# Origin: partnership_program_website/.github/workflows/android-play-release.yml
#
# - Builds the TWA in android-twa/ with bundleRelease, then uploads the AAB
#   to Play Console with a Service Account.
# - When PLAY_TRACK is production, changesNotSentForReview=false so Google
#   starts the review automatically.
#
# Setup:
#   1. Copy this file to .github/workflows/android-play-release.yml
#      <PLAY_PACKAGE_NAME> = stores.playPackageName (or identity.bundleId)
#      SCREENSHOT_URL      = "https://" + identity.productionDomain
#   2. Set PLAY_TRACK (internal for testing, production for release)
#   3. Register the secrets below
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64             upload-key .jks (base64)
#   ANDROID_KEYSTORE_PROPERTIES         keystore.properties contents
#   GOOGLE_PLAY_SA_JSON_BASE64          Service Account JSON (base64)
#   GOOGLE_PLAY_DATA_SAFETY_CSV         Data Safety CSV (raw)
#   GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64  Data Safety CSV (base64)
#   IOS_REVIEW_DEMO_USERNAME            demo account for review (optional)
#   IOS_REVIEW_DEMO_PASSWORD            demo account password (optional)
#
# Release notes: release-notes/CURRENT-ja.txt (max 500 chars)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-play-release.yml"
      - "android-twa/app/build.gradle"
      - "release-notes/CURRENT-ja.txt"
      - "scripts/play-publish.mjs"
      - "scripts/play-fill-listing.mjs"
      - "scripts/play-fill-data-safety.mjs"
      - "scripts/play-review-check.mjs"
      # Submit-time helpers that change runtime behaviour of the
      # Play release. Same lesson as the iOS workflow path-filter fix:
      # any script the workflow actually runs must appear here or
      # fixes to it can't retrigger a build.
      - "scripts/capture-play-screenshots.mjs"
      - "scripts/lib/play-api.mjs"
      - "store-assets/play/**"
      - "app.config.json"

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # From app.config.json
      PLAY_PACKAGE_NAME: <PLAY_PACKAGE_NAME>   # stores.playPackageName / identity.bundleId
      # internal = testing track. production starts Google review automatically.
      PLAY_TRACK: internal

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PROPERTIES GOOGLE_PLAY_SA_JSON_BASE64; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Playwright + pnpm only needed for the capture-play-screenshots
      # step further down. The earlier Play scripts (publish, fill-listing,
      # fill-data-safety) use only Node built-ins + scripts/lib/play-api.mjs.
      - name: Setup pnpm
        # Don't pass 'version:' — package.json#packageManager pins the pnpm version
        # version and pnpm/action-setup@v6 errors on multi-version specification.
        uses: pnpm/action-setup@v6
      - name: Install Node dependencies (for Playwright capture)
        run: pnpm install --frozen-lockfile

      - name: Restore signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-twa/android-upload-key.jks
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > android-twa/keystore.properties
          ls -l android-twa/android-upload-key.jks android-twa/keystore.properties

      # Fail early if the AAB would be signed with the wrong config.
      - name: Verify Android signing config
        run: node scripts/verify-android-signing-config.mjs --gradle android-twa/app/build.gradle

      - name: Build release AAB
        working-directory: android-twa
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          ls -l app/build/outputs/bundle/release/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Restore Service Account JSON
        env:
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .secrets
          printf '%s' "$GOOGLE_PLAY_SA_JSON_BASE64" | base64 -d > .secrets/google-play-sa.json
          # Sanity check (don't print contents).
          node -e "JSON.parse(require('fs').readFileSync('.secrets/google-play-sa.json','utf8')); console.log('SA JSON parsed OK')"

      # Regenerate release-notes/CURRENT-ja.txt from conventional-style
      # commit messages since the last v* tag. No-op if nothing
      # user-facing changed since the last release.
      - name: Regenerate ja release notes from commit messages
        run: |
          # Need full history for `git describe --tags`; checkout was shallow
          git fetch --tags --depth=0 origin || git fetch --tags --depth=100 origin || true
          node scripts/generate-release-notes.mjs --write || true
          echo '--- current release notes ---'
          cat release-notes/CURRENT-ja.txt
          echo '--- end ---'

      # Capture authenticated dashboard screenshots before the listing
      # upload step picks them up. Mirrors the iOS authenticated-capture
      # fix so Google reviewers see the post-login dashboard, not the
      # unauthenticated public LP. Hard-fails (exit 1) if reviewer creds
      # are missing for login-required apps.
      - name: Capture Play screenshots from prod URL (authenticated as reviewer)
        env:
          # "https://" + identity.productionDomain
          SCREENSHOT_URL: https://surechigai-romi.link
          IOS_REVIEW_DEMO_USERNAME: ${{ secrets.IOS_REVIEW_DEMO_USERNAME }}
          IOS_REVIEW_DEMO_PASSWORD: ${{ secrets.IOS_REVIEW_DEMO_PASSWORD }}
        run: |
          pnpm exec playwright install --with-deps chromium || npx --yes playwright@1.49 install --with-deps chromium
          node scripts/capture-play-screenshots.mjs
          ls -la store-assets/play/screenshots

      # Push store listing, developer contact, and store graphics into Play
      # Console via Android Publisher API. This is idempotent and runs before
      # the AAB publish step so Google reviewers see the correct metadata.
      - name: Pre-fill Play listing + developer contact + graphics
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
          PLAY_PREFILL_ALLOW_PERMISSION_SKIP: "1"
        run: node scripts/play-fill-listing.mjs

      - name: Pre-fill Play Data Safety from CSV (if provided)
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
          PLAY_DATA_SAFETY_CSV: ${{ secrets.GOOGLE_PLAY_DATA_SAFETY_CSV }}
          PLAY_DATA_SAFETY_CSV_BASE64: ${{ secrets.GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64 }}
          # Soft-fail on 403 (SA missing "Manage store presence") so the
          # release pipeline keeps building during the one-time UI grant.
          PLAY_PREFILL_ALLOW_PERMISSION_SKIP: "1"
        run: node scripts/play-fill-data-safety.mjs --optional

      - name: Publish to Play Console (uses $PLAY_TRACK)
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
          PLAY_AAB_PATH: android-twa/app/build/outputs/bundle/release/app-release.aab
        run: node scripts/play-publish.mjs

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .secrets/google-play-sa.json
          rm -f android-twa/android-upload-key.jks
          rm -f android-twa/keystore.properties
