# iOS / App Store 申請の事前 lint
#
# 移植元: web-ios-android/templates/workflows/ios-pre-submission-lint.yml
#         (元は partnership_program_website)
#
# ios-appstore-release が Apple に送る「前」に、既知の reject ベクタを
# 機械検査して赤で止める。Runs:
#   - iOS 申請に関係するファイルを触る PR 全部
#   - main への push（ios-appstore-release と対）
#   - workflow_dispatch（手動）
#
# Failure-mode mapping (Guideline → check)（実体は scripts/lint-pre-submission.mjs）:
#   5.1.1(v) — アカウント削除導線 + ページ + API procedure
#   2.3.10  — 他プラットフォーム文字列が release-notes / store metadata に混入
#   4.8 + 3.1.3(f) — reviewer-notes テンプレに Apple 文言の逐語引用
#   2.1(a) + 4.8 — iOS の Google 隠し3層 (fn + CSS + observer)
#   meta     — package.json semver + bundle ID 整合
#   工程ガード — 新規ファイルの git add 忘れ(tsuioku-no-kirameki.com 2026-07-06実戦。
#                check-tracked-imports.mjs。ローカル検証は作業ツリー基準のため、
#                この検査だけが git clone 直後 = CI/Vercel の実体を再現する)
#
# ── このリポでの調整点(2026-08-08) ──────────────────────────────────
# キットの paths は `client/src/**` を「Web フロントのソース」として挙げているが、
# このリポは Expo Router なのでそのディレクトリは存在しない。テンプレートのまま
# 残っていたため paths フィルタが実質機能しておらず、app/ や components/ を
# 触っても lint が走らない状態だった。実構成(app/components/features/lib/modules)に修正。
name: ios-pre-submission-lint

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "package.json"
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/**"
      - "modules/**"
      - "scripts/appstore-submit.mjs"
      - "scripts/asc-patch-review-detail.mjs"
      - "scripts/lint-pre-submission.mjs"
      - "scripts/check-tracked-imports.mjs"
      - "release-notes/**"
      - "store-assets/appstore/**"
      - "capacitor.config.json"
      - "app.config.json"
      - ".github/workflows/ios-pre-submission-lint.yml"
  pull_request:
    paths:
      - "package.json"
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/**"
      - "modules/**"
      - "scripts/appstore-submit.mjs"
      - "scripts/asc-patch-review-detail.mjs"
      - "scripts/lint-pre-submission.mjs"
      - "scripts/check-tracked-imports.mjs"
      - "release-notes/**"
      - "store-assets/appstore/**"
      - "capacitor.config.json"
      - "app.config.json"

permissions:
  contents: read

concurrency:
  group: ios-pre-submission-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check tracked imports (git clone 直後の import 解決を検証)
        run: node scripts/check-tracked-imports.mjs

      - name: Run pre-submission lint
        run: node scripts/lint-pre-submission.mjs
