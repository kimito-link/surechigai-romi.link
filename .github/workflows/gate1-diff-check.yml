# Gate 1: PR の差分から危険な変更・禁止ワードを検知する（強制ゲート）
# Branch protection で "Gate1 Diff Check / diff-check" を必須にすると、検知時はマージ不可になる
name: Gate1 Diff Check

on:
  pull_request:
    branches: [main]

jobs:
  diff-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Diff Check (Gate1)
        env:
          DIFF_BASE: origin/main
          DIFF_HEAD: HEAD
        run: node scripts/diff-check.mjs
