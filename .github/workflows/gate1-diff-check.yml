# Gate 1: PR 縺ｧ蜊ｱ髯ｺ螟画峩繝ｻ遖∵ｭ｢繝ｯ繝ｼ繝峨ｒ讀懃衍・亥ｼｷ蛻ｶ・・
# Branch protection 縺ｧ "Gate1 Diff Check / diff-check" 繧貞ｿ・医↓縺吶ｋ縺ｨ繝槭・繧ｸ荳榊庄縺ｫ縺ｪ繧・
name: Gate1 Diff Check

on:
  pull_request:
    branches: [main]

jobs:
  diff-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Diff Check (Gate1)
        env:
          DIFF_BASE: origin/main
          DIFF_HEAD: HEAD
        run: node scripts/diff-check.mjs
