# iOS 起動クラッシュ再現プローブ（調査専用・提出しない）
#
# 目的（2026-08-14）:
# App Store build 495 / 499 が Guideline 2.1(a) で連続却下された。
# どちらも iPad Air (M3) / iPadOS 26.6 で「起動即クラッシュ」。
# 添付 .ips は TurboModule 初期化中の uncaught ObjC 例外 (SIGABRT) と、
# Hermes の setNativeState 内 SEGV を示すが、**どのモジュールが投げたかは
# .ips からは特定できない**（リリースバイナリがストリップ済みでシンボル化不能）。
#
# ★このプローブの存在理由:
#   ローカル(Windows)では iOS シミュレータを一切動かせないため、
#   「実際に起動して落ちるところを見る」ことが今までできなかった。
#   その結果、静的な読みだけで仮説を3つ立てて3つとも外している
#   (expo-dev-client / babel の import-meta プラグイン / GoogleSignIn の GIDClientID)。
#   推測を止めて、実際のクラッシュ出力を取りに行くのがこの workflow。
#
# やること:
#   1. Release 構成でシミュレータ向けにビルド（審査と同じ最適化・同じ HBC バンドル）
#   2. **iPad** シミュレータで起動（審査と同じ機種クラスで再現させる）
#   3. 落ちたら .ips とコンソールログを artifact に上げる
#   4. iPhone でも同じことをして、iPad 固有かどうかを切り分ける
#
# 提出はしない。アーカイブも署名もしない。
name: ios-crash-probe

on:
  workflow_dispatch: {}

concurrency:
  group: ios-crash-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    # 60分では足りなかった（run #4 がちょうど60分で cancelled。
    # Release ビルドが重く、シミュレータ起動まで到達できていない）。
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode (iOS 26 SDK or later)
        run: |
          set -euo pipefail
          chosen=""
          for app in /Applications/Xcode_26*.app /Applications/Xcode_27*.app /Applications/Xcode_28*.app; do
            [ -d "$app" ] || continue
            chosen="$app"
          done
          if [ -z "$chosen" ]; then
            echo "::error::No Xcode 26+ found on this runner."
            ls -1d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ★審査に出すビルドと同じ条件にする（2026-08-19）。
      #   これが無いと Clerk 鍵の無いバンドルが出来て「セットアップエラー」画面になり、
      #   本物の不具合を調べているつもりで**別物を観測する**ことになる。
      #   実際 8/17 はこの差に気づかず、鍵なしのエラー画面を審査の症状と同一視した。
      - name: Write .env for Metro (EXPO_PUBLIC_*)
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY が未設定。リリースと同条件で再現できない。"
            exit 1
          fi
          echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" > .env
          echo "wrote .env (key length=${#EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY})"

      - name: Run expo prebuild (iOS)
        run: |
          set -euo pipefail
          rm -rf ios
          npx expo prebuild --platform ios --no-install

      # リリース workflow と同じ細工を必ず通すこと。これが無いと
      # 「AppCheckCore ... cannot yet be integrated as static libraries」で
      # pod install が落ちる（このプローブの初回実行で実際に踏んだ）。
      - name: Patch Podfile (use_modular_headers!)
        run: node scripts/patch-ios-podfile-modular-headers.mjs

      - name: pod install
        run: |
          set -euo pipefail
          PODDIR="$(dirname "$(find ios -maxdepth 2 -name Podfile | head -1)")"
          cd "$PODDIR"
          pod install --repo-update

      # ★Release 構成でビルドする。Debug では再現しない可能性が高い:
      #   react-native-worklets は release でのみ worklet を eval() で復元し
      #   (valueUnpacker.js の「in release we use the regular eval」)、
      #   バンドルも HBC 化されるため、Debug とは実行経路が別物になる。
      - name: Build for simulator (Release)
        run: |
          set -euo pipefail
          if [ -d ios/app.xcworkspace ]; then
            XCODE_FLAG=(-workspace ios/app.xcworkspace)
          else
            XCODE_FLAG=(-project ios/app.xcodeproj)
          fi
          xcodebuild \
            "${XCODE_FLAG[@]}" \
            -scheme app \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "--- built .app ---"
          find build/dd/Build/Products -maxdepth 2 -name "*.app" | sort

      - name: Launch on simulators and capture crash
        id: launch
        run: |
          set -euo pipefail
          APP="$(find build/dd/Build/Products -maxdepth 2 -name '*.app' | head -1)"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "app=$APP bundle=$BUNDLE_ID"
          mkdir -p /tmp/probe-out
          rm -rf ~/Library/Logs/DiagnosticReports/* 2>/dev/null || true

          # 審査は iPad。iPhone と両方試して iPad 固有かを切り分ける。
          probe_device() {
            local NAME="$1"
            echo ""
            echo "=============================================="
            echo "=== DEVICE: $NAME"
            echo "=============================================="
            local UDID
            UDID="$(xcrun simctl create "probe-$NAME" "$NAME" 2>/dev/null || true)"
            if [ -z "$UDID" ]; then
              echo "::warning::could not create simulator '$NAME' — skipping"
              return 0
            fi
            xcrun simctl boot "$UDID" || true
            # ★固定 sleep では足りない（2026-08-17）。起動途中に install/launch すると
            #   RBSServiceErrorDomain Code=1 "Client not authorized" で起動要求が拒否され、
            #   アプリが立ち上がらないまま「45秒生存」と誤判定していた。
            #   bootstatus はブート完了まで待って返る。念のため後ろにも余裕を取る。
            xcrun simctl bootstatus "$UDID" -b || true
            sleep 10
            xcrun simctl install "$UDID" "$APP"
            sleep 5

            # コンソールログを拾いながら起動する
            xcrun simctl spawn "$UDID" log stream --level debug \
              --predicate "processImagePath CONTAINS 'app'" \
              > "/tmp/probe-out/console-$NAME.log" 2>&1 &
            local LOGPID=$!
            sleep 3

            # ★--console-pty をタイムアウト無しで使ってはいけない（run #4 で実際に詰まった）。
            #   これはアプリの stdout に張り付き、**アプリが終了するまで戻らない**。
            #   クラッシュする版では自然に終わるので #2/#3 は完走したが、
            #   起動が成功する版（＝直った版）では永久に返らず、
            #   ジョブが 60 分でタイムアウトして cancelled になった。
            #   「直ったときだけ詰まる」ので、直る直前まで気づけない罠。
            # ★macOS には GNU coreutils の `timeout` が無い（run #6 で実際に踏んだ）。
            #   `timeout 45 ...` は "command not found"(rc=127) で即死し、
            #   アプリを一度も起動しないままログが空になる。
            #   それを VERDICT が「OK(痕跡なし)」と報告してしまい、
            #   **起動していないのに成功に見える**という最悪の偽陽性が出た。
            #   coreutils に依存せず、バックグラウンド起動＋待ち＋kill で打ち切る。
            set +e
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" \
              > "/tmp/probe-out/launch-$NAME.log" 2>&1 &
            local LAUNCHPID=$!
            local WAITED=0
            local RC=""
            while [ "$WAITED" -lt 45 ]; do
              if ! kill -0 "$LAUNCHPID" 2>/dev/null; then
                wait "$LAUNCHPID"; RC=$?
                break
              fi
              sleep 3
              WAITED=$((WAITED + 3))
              # ★アプリが前面にいるうちに撮る。kill 後に撮ると必ずホーム画面が写り、
              #   壁紙の色数を「描画されている」と誤判定する（2026-08-17 に2回踏んだ）。
              #   1枚だけだと起動タイミングのブレを吸収できず、実際に
              #   「起動前のホーム画面」が写った（2026-08-19）。複数枚撮って全部残す。
              # ★押して動くかを見る（2026-08-20・build 520 の却下）。
              #   「はじめる / Login with X が反応しない」で却下されたのに、
              #   このプローブは「起動して落ちない」ことしか確かめていなかった。
              #   押す前後のスクショを撮って、画面が変わるかで判定する。
              if [ "$WAITED" = "21" ]; then
                xcrun simctl io "$UDID" screenshot "/tmp/probe-out/tap-before-$NAME.png" 2>/dev/null || true
                bash scripts/qa/sim-tap-center.sh 0.55 || true
                sleep 6
                xcrun simctl io "$UDID" screenshot "/tmp/probe-out/tap-after-$NAME.png" 2>/dev/null || true
              fi
              if [ "$WAITED" = "9" ] || [ "$WAITED" = "18" ] || [ "$WAITED" = "30" ]; then
                xcrun simctl io "$UDID" screenshot                   "/tmp/probe-out/screen-$NAME-t${WAITED}.png" 2>/dev/null || true
                # 最後に撮れたものを代表として使う（後段の色数判定はこれを見る）
                cp "/tmp/probe-out/screen-$NAME-t${WAITED}.png"                    "/tmp/probe-out/screen-$NAME.png" 2>/dev/null || true
              fi
            done
            if [ -z "$RC" ]; then
              # 45秒たっても launch が張り付いたまま = アプリが生きている
              kill "$LAUNCHPID" 2>/dev/null || true
              RC="stayed_up"
              echo "LAUNCH_RESULT: STAYED_UP (45s 生存。クラッシュせず)"
            fi
            set -e

            # ★kill する前に、アプリが本当に動いているかを PID で確かめる（2026-08-17）。
            #   `stayed_up`（simctl launch のプロセスが45秒張り付いた）は
            #   **アプリが生きている証拠ではない**。実際、起動要求が
            #   RBSServiceErrorDomain Code=1 "Client not authorized" で拒否され、
            #   アプリが一度も立ち上がっていないのに stayed_up=OK と判定していた
            #   （launch ログ 0 バイト・スクリーンショットはホーム画面）。
            #   simctl の外側のプロセスではなく、シミュレータ内のプロセスを見る。
            # `simctl launch` は成功時に "<bundle id>: <pid>" を出す。これが唯一
            # 確実な「起動した」証跡。launchctl list は簿記上のエントリしか返さず、
            # 実際に前面で動いていても none になることがある（2026-08-17 に誤検出した）。
            local APP_PID
            APP_PID="$(grep -oE "$BUNDLE_ID: [0-9]+" "/tmp/probe-out/launch-$NAME.log" 2>/dev/null \
              | tail -1 | awk '{print $2}')"
            # launch ログは --console-pty がアプリの出力を受けるまで空のことがある
            # （静かに起動したケース。2026-08-19 に iPhone 側で NOT_RUNNING を誤検出）。
            # 取れなければコンソールログの "taskState: Running" からも拾う。
            if [ -z "$APP_PID" ]; then
              APP_PID="$(grep -oE 'pid: [0-9]+; taskState: Running' \
                "/tmp/probe-out/console-$NAME.log" 2>/dev/null | tail -1 \
                | grep -oE '[0-9]+' | head -1)"
            fi
            echo "APP_PID[$NAME]: '${APP_PID:-none}'"
            if [ -z "$APP_PID" ]; then
              echo "VERDICT[$NAME]: NOT_RUNNING (起動した証跡が無い)"
              echo "NOT_RUNNING" >> "/tmp/probe-out/verdicts-$NAME.txt"
            elif xcrun simctl spawn "$UDID" launchctl procinfo "$APP_PID" >/dev/null 2>&1; then
              echo "APP_STILL_ALIVE[$NAME]: yes (pid $APP_PID)"
            else
              # 起動はしたが 45 秒後には消えている＝審査の "Error on launch" と同じ姿
              echo "VERDICT[$NAME]: DIED_AFTER_LAUNCH (起動後に落ちた pid=$APP_PID)"
              echo "DIED_AFTER_LAUNCH" >> "/tmp/probe-out/verdicts-$NAME.txt"
            fi

            # 画面が出ているうちにスクリーンショットを撮る（kill 後だとホーム画面が写る）
            local SHOT="/tmp/probe-out/screen-$NAME.png"

            sleep 5
            kill $LOGPID 2>/dev/null || true

            echo "--- launch rc=$RC ---"
            # ★判定は fail-closed にすること（run #6 の教訓）。
            #   以前は「クラッシュ文言が無ければ OK」にしていたが、
            #   `timeout` が無くて起動すらできずログが空のとき、それを
            #   「OK(痕跡なし)」と報告してしまった＝**起動していないのに成功に見えた**。
            #   よって「アプリが動いた証拠がある」ことを先に要求する。
            LOGFILE="/tmp/probe-out/launch-$NAME.log"
            if grep -qiE "uncaught exception|terminating due to|RangeError|Unhandled JS Exception" \
                 "$LOGFILE" 2>/dev/null; then
              echo "VERDICT[$NAME]: CRASHED"
              echo "CRASHED" >> "/tmp/probe-out/verdicts-$NAME.txt"
            elif grep -qiE "command not found|No such file|Unable to boot|Invalid device" \
                   "$LOGFILE" 2>/dev/null; then
              # プローブ自身の不具合。成功と区別する（黙って緑にしない）
              echo "VERDICT[$NAME]: PROBE_BROKEN (起動を試せていない)"
              echo "PROBE_BROKEN" >> "/tmp/probe-out/verdicts-$NAME.txt"
            elif [ "$RC" = "stayed_up" ] || grep -qiE "_setUpFeatureFlags|UIApplicationDelegate|$BUNDLE_ID" \
                   "$LOGFILE" 2>/dev/null; then
              # アプリが実際に立ち上がった痕跡があり、かつクラッシュ文言が無い。
              # ★stayed_up の判定は「ログが空か」より先に置くこと（run #7 で誤判定した）。
              #   --console-pty はアプリが stdout に何も書かなければログが空のままになる。
              #   つまり「ログが空」は失敗ではなく、静かに動いている正常な姿でもある。
              #   45秒生きて kill された（=Terminated: 15）なら、それはクラッシュしなかった証拠。
              echo "VERDICT[$NAME]: OK (起動してクラッシュしなかった)"
              echo "OK" >> "/tmp/probe-out/verdicts-$NAME.txt"
            elif [ ! -s "$LOGFILE" ]; then
              echo "VERDICT[$NAME]: INCONCLUSIVE (ログが空。起動した証拠が無い)"
              echo "INCONCLUSIVE" >> "/tmp/probe-out/verdicts-$NAME.txt"
            else
              echo "VERDICT[$NAME]: INCONCLUSIVE (起動の痕跡を確認できない)"
              echo "INCONCLUSIVE" >> "/tmp/probe-out/verdicts-$NAME.txt"
            fi
            echo "--- launch output (tail) ---"
            tail -60 "/tmp/probe-out/launch-$NAME.log" || true
            echo "--- console errors (filtered) ---"
            grep -iE "crash|exception|fatal|abort|assert|terminating|SIGABRT|uncaught|NSInvalidArgument|Unhandled" \
              "/tmp/probe-out/console-$NAME.log" | head -60 || echo "(none)"

            # ★「落ちなかった」だけでは審査を通る保証にならない（2026-08-17 の却下）。
            #   プロセスが 45 秒生きていても、画面が真っ白なら審査は
            #   「Error on launch」と書いてくる。実際に描画されたかを画素で見る。
            #   ここは判定を厳しくする方向にしか働かないので、失敗しても probe 自体は続ける。
            if [ -f "$SHOT" ]; then
              # 画像の色数を数える。単色（=真っ白/真っ黒）なら描画されていない。
              local COLORS
              COLORS="$(python3 scripts/qa/png-distinct-colors.py "$SHOT" 2>/dev/null || echo "-1")"
              echo "SCREEN_COLORS[$NAME]: $COLORS"
              if [ "$COLORS" = "1" ]; then
                echo "VERDICT[$NAME]: BLANK_SCREEN (起動はしたが画面が単色＝何も描画されていない)"
                echo "BLANK_SCREEN" >> "/tmp/probe-out/verdicts-$NAME.txt"
              elif [ "$COLORS" = "-1" ] || [ "$COLORS" = "0" ]; then
                echo "::warning::screenshot check unavailable for $NAME"
              fi
            else
              echo "::warning::could not capture screenshot for $NAME"
            fi

            # シミュレータのクラッシュレポートを回収
            local CRASHDIR="$HOME/Library/Logs/DiagnosticReports"
            if ls "$CRASHDIR"/*.ips >/dev/null 2>&1; then
              echo "--- CRASH REPORTS FOUND ---"
              for f in "$CRASHDIR"/*.ips; do
                echo "=== $f ==="
                head -c 6000 "$f"
                cp "$f" "/tmp/probe-out/crash-$NAME-$(basename "$f")" || true
                echo ""
              done
            else
              echo "--- no .ips crash report (app may have stayed up) ---"
            fi

            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          }

          # 審査機と同クラスの iPad を最優先。名前は runner の在庫に依存するので候補を順に試す。
          #
          # ★ `grep -oE 'A|B|C' | head -1` は「候補の優先順」では選べない（2026-08-17 に踏んだ）。
          #   grep は入力（devicetypes の一覧）の出現順に出すので、head -1 が拾うのは
          #   「一覧で先に現れた機種」でしかない。実際、審査機と同じ iPad Air 11-inch (M3) が
          #   在庫にあったのに iPad Pro 11-inch (M4) が選ばれ、**審査と違う機種で緑を出していた**。
          #   候補を1つずつ順に問い合わせて、最初に見つかったものを採用する。
          DEVICE_TYPES="$(xcrun simctl list devicetypes)"
          pick_device() {
            for cand in "$@"; do
              if printf '%s\n' "$DEVICE_TYPES" | grep -qF "$cand"; then
                printf '%s' "$cand"
                return 0
              fi
            done
            return 0
          }
          IPAD_NAME="$(pick_device \
            'iPad Air 11-inch (M3)' \
            'iPad Air 13-inch (M3)' \
            'iPad Air 11-inch (M4)' \
            'iPad Air (5th generation)' \
            'iPad Pro 11-inch (M4)' \
            'iPad (10th generation)')"
          IPHONE_NAME="$(pick_device \
            'iPhone 17 Pro' 'iPhone 17' 'iPhone 16 Pro' 'iPhone 16' 'iPhone 15')"
          echo "picked iPad='$IPAD_NAME' iPhone='$IPHONE_NAME'"

          [ -n "$IPAD_NAME" ] && probe_device "$IPAD_NAME" || echo "::warning::no iPad device type available"
          [ -n "$IPHONE_NAME" ] && probe_device "$IPHONE_NAME" || echo "::warning::no iPhone device type available"

          # ★ここまで判定を出力するだけで、ジョブは常に success だった（2026-08-17 に発覚）。
          #   CRASHED でも緑になるので「プローブが通ったから提出」という判断ができない。
          #   審査機と同クラスの iPad が OK でない限り失敗させる（fail-closed）。
          echo ""
          echo "=============================================="
          echo "=== SUMMARY"
          echo "=============================================="
          FAILED=0
          for NAME in "$IPAD_NAME" "$IPHONE_NAME"; do
            [ -n "$NAME" ] || continue
            F="/tmp/probe-out/verdicts-$NAME.txt"
            if [ ! -s "$F" ]; then
              echo "  $NAME: (判定が記録されていない)"
              FAILED=1
              continue
            fi
            # 1台につき複数行出ることがある（起動判定＋画面判定）。厳しい方を採る。
            if grep -qE "CRASHED|BLANK_SCREEN|PROBE_BROKEN|INCONCLUSIVE|NOT_RUNNING|DIED_AFTER_LAUNCH" "$F"; then
              echo "  $NAME: NG -> $(tr '\n' ',' < "$F")"
              FAILED=1
            else
              echo "  $NAME: OK"
            fi
          done
          if [ "$FAILED" != "0" ]; then
            echo "::error::起動プローブが OK ではない。この状態で提出しないこと。"
            exit 1
          fi
          echo "すべての対象機種で起動と描画を確認した。"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-crash-probe-output
          path: /tmp/probe-out
          if-no-files-found: warn
